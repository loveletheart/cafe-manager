# Spring App 이름
spring.application.name=cafe-manager

# MySQL 드라이버 설정
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MySQL 접속 URL (퍼블릭 IP, 포트, DB명, 옵션 포함)
spring.datasource.url=jdbc:mysql://52.64.92.77:3306/management?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true

# MySQL 계정 정보
spring.datasource.username=master
spring.datasource.password=o90o90o90

# JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# 정적 리소스 및 템플릿 경로
spring.web.resources.static-locations=classpath:/static/,classpath:/images/,classpath:/build/
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# HTTPS 설정으로 변경
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=mypassword
server.ssl.key-alias=myapp

server.forward-headers-strategy=native

server.address=0.0.0.0

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Seoul

# 로컬 개발 환경에서 이 경로를 사용하여 QR 코드 이미지를 저장합니다.
app.qr.storage-path=src/main/resources/static/qr_codes/

# QR 코드에 담긴 애플리케이션의 기본 URL
# 현재는 같은 로컬 네트워크 내 모바일 접속을 위한 사설 IP 사용
qr.base.url=https://52.64.92.77:8443