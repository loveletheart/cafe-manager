<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>장바구니</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        .body { text-align: center; }
        .main_text { text-align: center; }
        .center_table { display: flex; justify-content: center; align-items: center; margin: 0 auto; }
        table { border: 1px solid #ccc; border-collapse: collapse; width: 95%; margin: 0 auto; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        .back-button, .payment-button {
            display: inline-block; padding: 12px 24px; font-size: 16px; color: white; border: none; border-radius: 20px;
            text-decoration: none; cursor: pointer; transition: background-color 0.3s ease;
        }
        .back-button { background-color: #ff6666; }
        .payment-button { background-color: #2699E6; }
        .quantity-control { display: flex; align-items: center; justify-content: center; gap: 5px; }
        .quantity-control input { width: 40px; text-align: center; border: none; background-color: transparent; pointer-events: none; }
        .quantity-control button { width: 30px; height: 30px; border: none; background-color: white; color: black; border-radius: 50%; cursor: pointer; font-size: 18px; }
        .quantity-control button:hover { background-color: #c0392b; color: white; }
        .menu-options { font-size: 18px; color: gray; margin-top: 4px; display: block; }
        .loading-message { margin-top: 10px; font-size: 18px; color: #555; font-weight: bold; display: none; }
    </style>
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
</head>
<body>
    <h1 class="main_text">장바구니</h1>

    <div th:if="${cartItems.size() > 0}" class="center_table" style="flex-direction: column; align-items: center;">
        <table>
            <thead>
                <tr style="background-color: #f2f2f2;">
                    <td style="width: 50%;">메뉴 이름</td>
                    <td style="width: 25%;">수량</td>
                    <td style="width: 25%;">가격</td>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cartItem : ${cartItems}"
                    th:attr="data-menu-name=${cartItem.menuName},
                             data-temperature=${cartItem.temperature},
                             data-bean-type=${cartItem.beanType},
                             data-cup-type=${cartItem.cupType},
                             data-syrup=${cartItem.syrup},
                             data-user-id=${cartItem.userId}">
                    <td>
                        <div style="display: flex; align-items: center;">
                            <img th:src="@{|/images/${cartItem.menuNameen}.jpg|}" th:alt="${cartItem.menuNameen}" style="width:100px; height:100px; margin-right: 10px;">
                            <div style="display: flex; flex-direction: column; align-items: flex-start;">
                                <div th:text="${cartItem.menuName}" style="font-size: 25px; font-weight: 1000; margin-bottom: 4px;"></div>
                                <div class="menu-options" th:text="${cartItem.temperature} + ' / ' + ${cartItem.beanType} + ' / ' + ${cartItem.cupType} + ' / ' + ${cartItem.syrup}"></div>
                            </div>
                        </div>
                    </td>
                    <td>
                        <div class="quantity-control">
                            <button class="decrease-btn">-</button>
                            <input type="number" class="item-count" th:value="${cartItem.count}" style="font-size: 25px" readonly>
                            <button class="increase-btn">+</button>
                        </div>
                    </td>
                    <td th:text="${cartItem.price * cartItem.count}+ '원'" style="font-weight: 1000; font-size: 20px;"></td>
                </tr>
            </tbody>
        </table>

        <div style="margin-top: 20px;">
            <p style="font-size: 25px; font-weight: bold;">총 금액: <span id="total-sum" th:text="${totalPrice}">0</span>원</p>
        </div>
    </div>

    <div th:if="${cartItems.size() == 0}">
        <p>장바구니가 비었습니다.</p>
    </div>

    <div style="margin-top: 20px; text-align: center;">
        <a href="/menu" class="back-button">메뉴로 돌아가기</a>
        <button class="payment-button" id="checkoutButton">구매하기</button>
        <div id="loadingMessage" class="loading-message">주문 처리 중입니다... 잠시만 기다려 주세요.</div>
    </div>

<script>
    let stompClient = null;

 // 수정된 connectWebSocket 함수
    function connectWebSocket() {
        const socket = new SockJS("/ws/order");
        stompClient = Stomp.over(socket);

        const connectCallback = function() {
            console.log("웹소켓 연결 성공");
            
            // 서버로부터의 주문 상태 응답을 구독합니다.
            stompClient.subscribe("/sub/orders", function (message) {
                const result = JSON.parse(message.body);
                if (result.status === "success") {
                    alert("주문이 완료되었습니다!");
                    window.location.href = "/menu/coffee";
                } else {
                    alert("주문 처리 중 오류가 발생했습니다: " + result.message);
                    isProcessingOrder = false;
                    $("#checkoutButton").prop("disabled", false).text("구매하기");
                    $("#loadingMessage").hide();
                }
            });
            setupButtonListeners();
        };

        const errorCallback = function(error) {
            console.error("STOMP 연결 실패:", error);
            alert("서버 연결에 실패했습니다. 페이지를 새로고침하거나 잠시 후 다시 시도해주세요.");
        };

        stompClient.connect({}, connectCallback, errorCallback);
    }

    let isProcessingOrder = false;

    function setupButtonListeners() {
        $("#checkoutButton").click(function () {
            if (isProcessingOrder) return;
            console.log("주문 버튼 클릭 - 주문 메시지 전송 시작");

            const cartItems = [];
            $("tr[data-menu-name]").each(function () {
                const row = $(this);
                const menuName = row.attr("data-menu-name");
                const quantity = parseInt(row.find(".item-count").val());
                const priceText = row.find("td:nth-last-child(1)").text();
                const totalItemPrice = parseInt(priceText.replace("원", "").trim());
                const price = totalItemPrice / quantity;

                const temperature = row.attr("data-temperature");
                const beanType = row.attr("data-bean-type");
                const cupType = row.attr("data-cup-type");
                const syrup = row.attr("data-syrup");
                const userId = row.attr("data-user-id");

                if (quantity > 0) {
                    cartItems.push({ 
                        menuName, quantity, price, userId,
                        temperature, beanType, cupType, syrup
                    });
                }
            });

            if (cartItems.length === 0) {
                alert("장바구니가 비었습니다.");
                return;
            }

            isProcessingOrder = true;
            $("#checkoutButton").prop("disabled", true).text("주문 처리 중...");
            $("#loadingMessage").show();

            // 주문 데이터를 JSON 문자열로 변환하여 서버에 전송
            stompClient.send("/pub/order/check", {}, JSON.stringify(cartItems));
        });
    }

    $(document).ready(function () {
        connectWebSocket();
    });
</script>
</body>
</html>
