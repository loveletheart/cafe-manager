<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>옵션 폼</title>
</head>
<body>
<div th:fragment="optionForm" class="modal-options">
  <form th:action="@{/menu/options/add}" method="post" id="optionForm">
    <input type="hidden" name="menuName" th:value="${menu.menuName}" />
    <input type="hidden" name="menuNameen" th:value="${menu.menuNameen}" />
    <input type="hidden" name="price" th:value="${menu.price}" />

    <p>온도 선택</p>
    <div id="temp-error" class="error-message">온도를 선택하세요.</div>
    <div class="option-group-labels">
      <input type="radio" name="temperature" value="HOT" id="tempHot" />
      <label for="tempHot" class="toggle-label">HOT</label>
      <input type="radio" name="temperature" value="ICE" id="tempIce" />
      <label for="tempIce" class="toggle-label">ICE</label>
    </div>
    
    <p>원두 선택</p>
    <div id="bean-error" class="error-message">원두를 선택하세요.</div>
    <div class="option-group-labels">
      <input type="radio" name="beanType" value="아라비카" id="beanArabica" data-desc="부드럽고 고소한 맛의 아라비카 원두입니다." />
      <label for="beanArabica" class="toggle-label">아라비카</label>
      <input type="radio" name="beanType" value="로부스타" id="beanRobusta" data-desc="강하고 진한 맛의 로부스타 원두입니다." />
      <label for="beanRobusta" class="toggle-label">로부스타</label>
      <input type="radio" name="beanType" value="에티오피아" id="beanEthiopia" data-desc="과일향과 산미가 뛰어난 에티오피아 원두입니다." />
      <label for="beanEthiopia" class="toggle-label">에티오피아</label>
    </div>
    <p id="bean-description"></p>

    <p>컵 선택</p>
    <div id="cup-error" class="error-message">컵을 선택하세요.</div>
    <div class="option-group-labels">
      <input type="radio" name="cupType" value="매장컵" id="cupStore" />
      <label for="cupStore" class="toggle-label">매장컵</label>
      <input type="radio" name="cupType" value="일회용컵" id="cupDisposable" />
      <label for="cupDisposable" class="toggle-label">일회용컵</label>
      <input type="radio" name="cupType" value="개인컵" id="cupPersonal" />
      <label for="cupPersonal" class="toggle-label">개인컵</label>
    </div>

    <p>시럽 선택</p>
    <div class="option-group-labels">
      <input type="checkbox" name="syrup" value="바닐라" id="syrupVanilla" />
      <label for="syrupVanilla" class="toggle-label">바닐라</label>
      <input type="checkbox" name="syrup" value="헤이즐넛" id="syrupHazelnuts" />
      <label for="syrupHazelnuts" class="toggle-label">헤이즐넛</label>
      <input type="checkbox" name="syrup" value="카라멜" id="syrupCaramel" />
      <label for="syrupCaramel" class="toggle-label">카라멜</label>
      <input type="checkbox" name="syrup" value="초코" id="syrupChocolate" />
      <label for="syrupChocolate" class="toggle-label">초코</label>
    </div>

    <p>수량 선택:</p>
    <div class="quantity-control">
      <button type="button" id="minus-btn">-</button>
      <input type="number" name="count" value="1" min="1" readonly />
      <button type="button" id="plus-btn">+</button>
    </div>

    <button type="submit" class="add-to-cart-button">장바구니에 담기</button>
    <div class="loading-message" id="add-to-cart-loading">장바구니에 추가 중...</div>
  </form>
</div>
</body>
</html>
