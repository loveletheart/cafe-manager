<!-- templates/menu/coffee.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>커피 메뉴</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <meta name="_csrf" th:content="${_csrf.token}" />
  <meta name="_csrf_header" th:content="${_csrf.headerName}" />
  <link rel="stylesheet" href="/css/options.css" />

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
      background-color: white;
      overflow-x: hidden;
    }

    body.no-scroll {
      overflow: hidden;
      position: fixed;
      width: 100%;
    }

    .categories {
      margin-top: 20px;
      padding: 10px 0;
      display: flex;
      justify-content: space-evenly;
      width: 100vw;
      background-color: #cae1f2;
      gap: 5px;
    }

    .categories a {
      flex: 1;
      text-decoration: none;
      color: black;
      font-size: 25px;
      font-weight: bold;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #cae1f2;
      padding: 10px 0;
    }

    .categories a.active {
      background-color: white;
      color: black;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      padding: 0 15px 20px 15px;
    }

    .menu-item {
      border: 1px solid gray;
      padding: 20px;
      border-radius: 10px;
      background-color: #f9f9f9;
    }

    .cart-button {
      display: inline-block;
      padding: 12px 24px;
      font-size: 24px;
      color: white;
      background-color: #ff6666;
      border-radius: 20px;
      text-decoration: none;
      margin-top: 30px;
    }

    .add-to-cart-button {
      border-radius: 20px;
      font-size: 18px;
      font-weight: bold;
      background-color: white;
      color: #4682B4;
      border: 1px solid #4682B4;
      padding: 10px 20px;
      cursor: pointer;
    }

    /* 모달 기본 구조 */
    .modal {
      display: none;
      justify-content: center;
      align-items: flex-start;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.4);
      z-index: 999;
      overflow-y: auto;
      padding: 40px 0;
      box-sizing: border-box;
    }

    .modal-content {
      width: 100%;
      max-width: 480px;
      margin: auto;
      position: relative;
      background: transparent;
    }

    .close {
      position: absolute;
      top: 16px;
      right: 16px;
      font-size: 28px;
      color: #999;
      background: none;
      border: none;
      cursor: pointer;
    }

    .close:hover {
      color: black;
    }
  </style>
</head>
<body>
<h1>커피 메뉴</h1>

<div class="categories">
  <a th:href="@{/menu/coffee}" th:classappend="${activeCategory == 'coffee'} ? 'active'">커피</a>
  <a th:href="@{/menu/aid}" th:classappend="${activeCategory == 'aid'} ? 'active'">에이드</a>
  <a th:href="@{/menu/cookie}" th:classappend="${activeCategory == 'cookie'} ? 'active'">쿠키</a>
  <a th:href="@{/menu/bread}" th:classappend="${activeCategory == 'bread'} ? 'active'">빵</a>
  <a th:href="@{/menu/cake}" th:classappend="${activeCategory == 'cake'} ? 'active'">케이크</a>
</div>

<div class="menu-grid">
  <div class="menu-item" th:each="menu : ${menus}">
    <img th:src="@{|/images/${menu.menuNameen}.jpg|}" th:alt="${menu.menuName}" style="width:300px;height:300px;">
    <p><span th:text="${menu.menuName}" style="font-size: 24px; font-weight: bold;"></span></p>
    <p><span th:text="${menu.price}" style="font-size: 22px; font-weight: normal;"></span><span>원</span></p>
    <button class="add-to-cart-button" th:data-menuname="${menu.menuName}">메뉴 선택</button>
  </div>
</div>

<a href="/menu/cart" class="cart-button">장바구니</a>

<!-- 옵션 모달 -->
<div id="optionModal" class="modal">
  <div class="modal-content">
    <button class="close" aria-label="닫기">&times;</button>
    <div id="optionFormContainer">
      <!-- AJAX로 불러올 옵션 폼 위치 -->
    </div>
  </div>
</div>

<script>
  $(document).ready(function () {
    const csrfToken = $('meta[name="_csrf"]').attr('content');
    const csrfHeader = $('meta[name="_csrf_header"]').attr('content');

    function openModal() {
      $('#optionModal').fadeIn();
      $('body').addClass('no-scroll');
    }

    function closeModal() {
      $('#optionModal').fadeOut();
      $('body').removeClass('no-scroll');
    }

    $('.add-to-cart-button').click(function () {
      const menuName = $(this).data('menuname');
      $.ajax({
        url: '/menu/order/' + encodeURIComponent(menuName),
        method: 'GET',
        success: function (html) {
          $('#optionFormContainer').html(html);
          openModal();
        },
        error: function () {
          alert('옵션 정보를 불러오지 못했습니다.');
        }
      });
    });

    $('#optionModal').on('click', function (e) {
      if (e.target.id === 'optionModal') {
        closeModal();
      }
    });

    $('#optionModal .close').click(function () {
      closeModal();
    });

    
    $('#optionFormContainer').on('submit', '#optionForm', function (e) {
        e.preventDefault();

        let valid = true;
        $('#temp-error, #cup-error').hide();

        if (!$('input[name="temperature"]:checked').length) {
          $('#temp-error').show();
          valid = false;
        }
        
        if (!$('input[name="beanType"]:checked').length) {
            $('#bean-error').show();
            valid = false;
          }

        if (!$('input[name="cupType"]:checked').length) {
          $('#cup-error').show();
          valid = false;
        }

        if (!valid) return;
  });
  });
</script>
</body>
</html>
