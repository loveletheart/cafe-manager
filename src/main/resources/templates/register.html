<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif; /* Google Fonts 적용 */
            background: linear-gradient(135deg, #f0f2f5 0%, #e0e6ed 100%); /* 부드러운 그라데이션 배경 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* 화면 전체 높이 사용 */
            margin: 0;
            color: #333;
            line-height: 1.6;
            overflow: hidden; /* 스크롤바 숨김 */
        }

        /* 회원가입 컨테이너 */
        .register-wrapper {
            background: #ffffff;
            padding: 40px;
            border-radius: 15px; /* 더 부드러운 모서리 */
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15); /* 입체감 있는 그림자 */
            width: 100%;
            max-width: 420px; /* 적절한 너비 제한 */
            text-align: center;
            box-sizing: border-box;
            transform: translateY(0); /* 초기 위치 */
            animation: fadeInScale 0.7s ease-out forwards; /* 등장 애니메이션 */
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .register-wrapper h2 {
            color: #333;
            margin-bottom: 35px;
            font-size: 2.2em; /* 제목 크기 키우기 */
            font-weight: 700; /* 더 굵은 글씨 */
            letter-spacing: -0.5px;
        }

        /* 에러 메시지 스타일 */
        .error-message {
            background-color: #ffebee; /* 옅은 빨강 */
            color: #d32f2f; /* 진한 빨강 */
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid #ef9a9a;
            font-weight: 500;
            font-size: 0.95em;
            text-align: left;
        }

        /* 입력 필드 및 드롭다운 스타일 */
        .register-wrapper input[type="text"],
        .register-wrapper input[type="password"],
        .register-wrapper select {
            width: 100%;
            padding: 15px 18px; /* 패딩 증가 */
            margin-bottom: 18px; /* 간격 조절 */
            border: 1px solid #e0e0e0; /* 부드러운 테두리 */
            border-radius: 10px; /* 더 둥근 모서리 */
            font-size: 1.05em;
            transition: all 0.3s ease;
            box-sizing: border-box;
            background-color: #fcfcfc;
            color: #333;
        }

        .register-wrapper input[type="text"]::placeholder,
        .register-wrapper input[type="password"]::placeholder {
            color: #aaa; /* 플레이스홀더 색상 */
        }

        .register-wrapper input[type="text"]:focus,
        .register-wrapper input[type="password"]:focus,
        .register-wrapper select:focus {
            border-color: #007bff; /* 포커스 시 강조 색상 */
            box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.15); /* 부드러운 그림자 효과 */
            outline: none;
            background-color: #ffffff;
        }

        /* 드롭다운 화살표 커스터마이징 */
        .register-wrapper select {
            appearance: none; /* 기본 화살표 숨기기 */
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23007bff%22%20d%3D%22M287%2069.9a17.6%2017.6%200%200%200-24.8%200L146.2%20185.7%2030.2%2069.9A17.6%2017.6%200%200%200%205.4%2094.7l116%20116%20116-116a17.6%2017.6%200%200%200%200-24.8z%22%2F%3E%3C%2Fsvg%3E');
            background-repeat: no-repeat;
            background-position: right 18px center;
            background-size: 14px;
            padding-right: 40px; /* 화살표 공간 확보 */
        }

        /* 버튼 스타일 */
        .register-wrapper button[type="submit"] {
            background-color: #007bff; /* 메인 강조 색상 */
            color: white;
            padding: 16px 25px; /* 패딩 증가 */
            border: none;
            border-radius: 10px; /* 더 둥근 모서리 */
            font-size: 1.15em; /* 글씨 크기 키우기 */
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            width: 100%;
            box-sizing: border-box;
            font-weight: 700;
            margin-top: 10px; /* 위쪽 간격 추가 */
            letter-spacing: 0.5px;
        }

        .register-wrapper button[type="submit"]:hover {
            background-color: #0056b3; /* 호버 시 색상 변경 */
            transform: translateY(-3px); /* 살짝 떠오르는 효과 */
            box-shadow: 0 8px 20px rgba(0, 123, 255, 0.3); /* 호버 시 그림자 추가 */
        }

        .register-wrapper button[type="submit"]:active {
            transform: translateY(0); /* 클릭 시 원위치 */
            box-shadow: 0 4px 10px rgba(0, 123, 255, 0.2);
        }

        /* 링크 스타일 */
        .register-wrapper p {
            margin-top: 35px; /* 위쪽 간격 증가 */
            font-size: 0.95em;
            color: #666;
        }

        .register-wrapper p a {
            color: #007bff;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease, text-decoration 0.3s ease;
        }

        .register-wrapper p a:hover {
            color: #0056b3;
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="register-wrapper">
    <h2>회원가입</h2>
    <div th:if="${errorMessage}" class="error-message">
        <p th:text="${errorMessage}"></p>
    </div>
    <form id="register-form" method="post" action="/register">
        <input type="text" name="id" placeholder="아이디" required>
        <input type="text" name="username" placeholder="이름" required>
        <input type="password" name="password" placeholder="비밀번호" required>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button type="submit">회원가입</button>
    </form>
    <p>이미 계정이 있으신가요? <a th:href="@{/login}">로그인하기</a></p>
</div>
</body>
</html>
