<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>로그인</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style type="text/css">
    :root {
        --primary-color: #6A24FE; /* 메인 보라색 */
        --accent-color: #28a745; /* 강조 녹색 (예: 회원가입 버튼) */
        --text-color: #333;
        --placeholder-color: #A0A0A0;
        --background-light: #F8F8F8;
        --border-color: #E0E0E0;
        --shadow-light: rgba(0, 0, 0, 0.08);
        --border-radius: 8px;
        --transition-speed: 0.3s;
    }

    /* 모든 요소에 box-sizing 적용 */
    * {
        box-sizing: border-box;
    }

    body {
        font-family: 'Noto Sans KR', sans-serif; /* 한국어 폰트 적용 */
        font-size: 16px;
        line-height: 1.6;
        color: var(--text-color);
        background: linear-gradient(135deg, #f0f4f8, #e0e7ee); /* 부드러운 그라데이션 배경 */
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh; /* 뷰포트 전체 높이 사용 */
        margin: 0;
        padding: 20px; /* 작은 화면을 위한 여백 */
    }

    .login-wrapper { /* 클래스명 유지 */
        background: #fff;
        padding: 45px 50px;
        border-radius: var(--border-radius);
        box-shadow: 0 10px 30px var(--shadow-light); /* 더 눈에 띄는 그림자 */
        width: 100%;
        max-width: 450px; /* 너비 증가 */
        text-align: center;
    }

    .login-wrapper > h2 {
        font-size: 2.2em;
        color: var(--primary-color);
        margin-bottom: 30px;
        font-weight: 700;
    }

    #login-form {
        display: flex;
        flex-direction: column;
        gap: 18px; /* 폼 요소 간 간격 */
    }

    #login-form > input[type="text"],
    #login-form > input[type="password"] {
        width: 100%;
        padding: 14px 18px;
        border: 1px solid var(--border-color);
        border-radius: var(--border-radius);
        background-color: var(--background-light);
        font-size: 1em;
        transition: border-color var(--transition-speed), box-shadow var(--transition-speed);
    }

    #login-form > input[type="text"]:focus,
    #login-form > input[type="password"]:focus {
        border-color: var(--primary-color);
        outline: none;
        box-shadow: 0 0 0 3px rgba(106, 36, 254, 0.2); /* 포커스 시 그림자 */
    }

    #login-form > input::placeholder {
        color: var(--placeholder-color);
    }

    /* 아이디 저장 체크박스 스타일 */
    .remember-me-checkbox {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 5px;
        font-size: 0.95em;
        color: var(--text-color);
        justify-content: flex-start; /* 왼쪽 정렬 */
        cursor: pointer; /* 클릭 가능한 표시 */
    }

    .remember-me-checkbox input[type="checkbox"] {
        appearance: none; /* 기본 체크박스 스타일 제거 */
        width: 18px;
        height: 18px;
        border: 2px solid var(--primary-color);
        border-radius: 4px;
        position: relative;
        transition: background-color var(--transition-speed), border-color var(--transition-speed);
    }

    .remember-me-checkbox input[type="checkbox"]:checked {
        background-color: var(--primary-color);
        border-color: var(--primary-color);
    }

    .remember-me-checkbox input[type="checkbox"]:checked::after {
        content: '✔'; /* 체크 표시 */
        color: #fff;
        font-size: 12px;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }

    #login-form > input[type="submit"] {
        background-color: var(--primary-color);
        color: #fff;
        font-size: 1.15em;
        font-weight: 600;
        padding: 15px 20px;
        border: none;
        border-radius: var(--border-radius);
        cursor: pointer;
        margin-top: 25px; /* 버튼 위 여백 */
        transition: background-color var(--transition-speed), transform var(--transition-speed);
    }

    #login-form > input[type="submit"]:hover {
        background-color: #551acb; /* 호버 시 색상 변경 */
        transform: translateY(-2px); /* 살짝 위로 이동 */
    }

    /* 회원가입 링크 스타일 */
    .register-link {
        margin-top: 30px;
        font-size: 0.95em;
        color: var(--text-color);
    }

    .register-link a {
        color: var(--primary-color);
        text-decoration: none;
        font-weight: 600;
        transition: color var(--transition-speed);
    }

    .register-link a:hover {
        color: #551acb;
        text-decoration: underline;
    }

    /* 반응형 디자인 */
    @media (max-width: 500px) {
        .login-wrapper {
            padding: 30px 25px;
            margin: 15px;
        }
        .login-wrapper > h2 {
            font-size: 1.8em;
            margin-bottom: 25px;
        }
        #login-form > input[type="text"],
        #login-form > input[type="password"] {
            padding: 12px 15px;
            font-size: 0.95em;
        }
        #login-form > input[type="submit"] {
            font-size: 1em;
            padding: 13px 18px;
        }
    }
</style>
<script>
    window.onload = function() {
        // 로그인 실패 시 alert 표시
        if (new URLSearchParams(window.location.search).has('error')) {
            alert('아이디 또는 비밀번호가 올바르지 않습니다.');
        }
    };
</script>
</head>
<body>
    <div class="login-wrapper">
        <h2>Login</h2>
        <form method="post" th:action="@{/login}" id="login-form">
		    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
		
		    <input type="text" name="username" placeholder="아이디" required>
		    <input type="password" name="password" placeholder="비밀번호" required>
		
		    <label for="remember-check" class="remember-me-checkbox">
		        <input type="checkbox" id="remember-check" name="remember-me"> 아이디 저장하기
		    </label>
		
		    <input type="submit" value="로그인">
		</form>
		
		<p class="register-link">신규회원이신가요?  <a th:href="@{/register}">회원가입하기</a></p>
    </div>
</body>
</html>
