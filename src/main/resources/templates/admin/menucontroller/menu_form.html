<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>메뉴 추가/수정</title>
    <style>
		    * {
		    box-sizing: border-box;
		}
		
        body {
		    font-family: 'Noto Sans KR', sans-serif;
		    max-width: 600px;
		    margin: 50px auto;
		    padding: 20px 20px;
		    background: #f9f9f9;
		    border-radius: 10px;
		    box-shadow: 0 0 15px rgba(0,0,0,0.1);
		}

        h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            font-weight: bold;
        }

        input[type="text"],
        input[type="number"],
        input[type="file"] {
		    width: 100%;
		    padding: 6px 10px;
		    border: 1px solid #ccc;
		    border-radius: 4px;
		    background-color: #fff;
		    margin-bottom: 20px; 
		}

        button {
            background-color: #4CAF50;
            color: white;
            padding: 12px;
            width: 100%;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        .error {
            color: red;
            margin-bottom: 15px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            text-align: center;
            width: 100%;
            color: #333;
            text-decoration: none;
        }

        img.preview {
            max-width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<h2 th:text="${menu.menu_Name == null ? '메뉴 추가' : '메뉴 수정'}"></h2>

<div th:if="${error}" class="error">
    <p th:text="${error}"></p>
</div>

<form th:action="@{${menu.menu_Name == null} ? '/admin/menu/add' : '/admin/menu/edit/' + ${menu.menu_Name}}"
      th:object="${menu}" method="post" enctype="multipart/form-data">

    <label>메뉴 이름 (PK)</label>
    <input type="text" th:field="*{menu_Name}" th:readonly="${menu.menu_Name != null}" required/>

    <label>영문 이름</label>
    <input type="text" th:field="*{menu_Nameen}" required/>

    <label>타입</label>
    <input type="text" th:field="*{type}" required/>

    <label>가격</label>
    <input type="number" th:field="*{price}" required/>

    <label>이미지 업로드</label>
    <input type="file" name="image" accept="image/*" />

    <button type="submit">저장</button>
</form>

<a th:href="@{/admin/menucontroller/menus}">← 목록으로 돌아가기</a>
</body>
</html>
