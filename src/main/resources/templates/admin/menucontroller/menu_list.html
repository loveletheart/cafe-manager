<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>메뉴 목록</title>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
        }

        .container {
            width: 80%;
            max-width: 1000px;
            margin: auto;
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        /* 고정될 헤더 영역 */
        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: #f9f9f9;
            padding-top: 20px;
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
            width: 100%;
        }

        .add-button {
            padding: 8px 16px;
            border: 2px solid #020715;
            background-color: #ffffff;
            color: #007bff;
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .add-button:hover {
            background-color: #007bff;
            color: white;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 12px 16px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }

        .action-buttons a {
            padding: 6px 12px;
            border-radius: 8px;
            text-decoration: none;
            margin: 0 4px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .edit-button {
            background-color: #e7f1ff;
            color: #007bff;
            border: 1px solid #007bff;
        }

        .edit-button:hover {
            background-color: #007bff;
            color: white;
        }

        .delete-button {
            background-color: #ffe8e8;
            color: #d72638;
            border: 1px solid #d72638;
        }

        .delete-button:hover {
            background-color: #d72638;
            color: white;
        }

        /* 필터 폼 관련 CSS */
        .filter-form {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .search-form {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search-form input[type="text"],
        .search-form input[type="number"],
        .search-form select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
            transition: all 0.3s ease;
            width: 150px;
        }

        .search-form input[type="text"]:focus,
        .search-form input[type="number"]:focus,
        .search-form select:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
        }

        .search-form select {
            width: 170px;
        }

        .price-filter {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .price-filter label {
            font-weight: bold;
        }
        
        .price-filter input[type="number"] {
            width: 80px;
            text-align: right;
            -moz-appearance: textfield;
        }

        .price-filter input[type="number"]::-webkit-outer-spin-button,
        .price-filter input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .search-button, .reset-button {
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
            border: none;
        }

        .search-button {
            background-color: #007bff;
            color: white;
        }

        .search-button:hover {
            background-color: #0056b3;
        }

        .reset-button {
            background-color: #6c757d;
            color: white;
        }

        .reset-button:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>메뉴 목록</h2>
    
    <div class="sticky-header">
        <div class="filter-form">
            <form th:action="@{/admin/menucontroller/listsearch}" method="get" class="search-form">
                <input type="text" name="menuName" placeholder="메뉴 이름" th:value="${param.menuName}">
                <input type="text" name="menuNameen" placeholder="영문이름" th:value="${param.menuNameen}">
                
                <select name="type">
                    <option value="">전체 타입</option>
                    <option value="coffee" th:selected="${param.type == 'coffee'}">coffee</option>
                    <option value="bread" th:selected="${param.type == 'bread'}">bread</option>
                    <option value="aid" th:selected="${param.type == 'aid'}">aid</option>
                    <option value="cake" th:selected="${param.type == 'cake'}">cake</option>
                    <option value="cookie" th:selected="${param.type == 'cookie'}">cookie</option>
                </select>
                
                 <div class="price-filter">
                    <label>가격:</label>
                    <input type="number" name="priceMin" placeholder="0" th:value="${param.priceMin}">
                    <span>~</span>
                    <input type="number" name="priceMax" th:value="${param.priceMax}">
                </div>
                
                <button type="submit" class="search-button">검색</button>
                <a th:href="@{/admin/menucontroller/listsearch}" class="reset-button">초기화</a>
            </form>
        </div>
        
        <div class="top-bar">
            <a th:href="@{/admin/menucontroller/add}" class="add-button">➕ 메뉴 추가</a>
        </div>
    </div>

    <script th:inline="javascript">
        var alertMessage = /*[[${complete}]]*/ '';
        if (alertMessage) {
            alert(alertMessage);
        }
    </script>

    <table>
        <thead>
        <tr>
            <th>이름</th>
            <th>영문이름</th>
            <th>타입</th>
            <th>가격</th>
            <th>수정/삭제</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="menu : ${menus}">
            <td th:text="${menu.menuName}"></td>
            <td th:text="${menu.menuNameen}"></td>
            <td th:text="${menu.type}"></td>
            <td th:text="${menu.price}"></td>
            <td class="action-buttons">
                <a th:href="@{|/admin/menucontroller/edit/${menu.menuName}|}" class="edit-button">수정</a>
                <a th:href="@{|/admin/menucontroller/delete/${menu.menuName}|}"
                   class="delete-button"
                   onclick="return confirm('정말 삭제하시겠습니까?')">삭제</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
